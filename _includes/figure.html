<figure>
    <a href="{{ include.url | relative_url }}" target="_blank">
        <img src="{{ include.url | relative_url }}" 
             alt="{{ include.caption }}"
             style="display: block; margin: 0 auto; max-width: 100%; height: auto;">
    </a>
    {% if include.caption %}
    <figcaption>{{ include.caption }}</figcaption>
    {% endif %}
</figure>
